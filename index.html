<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Khanhlo — Roblox Scripting</title>

  <style>
    :root {
      --bg: #111;
      --surface: #1d1d1d;
      --line: rgba(255,255,255,.13);
      --yellow: #ffcf00;
      --muted: #b6b6b6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: auto;
      padding: 0 24px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(17,17,17,.95);
      backdrop-filter: blur(14px);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .brand {
      border: 0;
      background: none;
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .brand span,
    h1 span,
    h2 strong,
    .card h3 {
      color: var(--yellow);
    }

    nav {
      display: flex;
      gap: 32px;
      margin-left: auto;
    }

    .nav-link,
    .login {
      border: 0;
      background: none;
      color: #c5c5c5;
      font-size: 14px;
    }

    .nav-link:hover,
    .login:hover {
      color: #fff;
    }

    .join,
    .main-button {
      border: 0;
      border-radius: 8px;
      background: var(--yellow);
      color: #111;
      font-weight: 800;
      transition: .2s;
    }

    .join {
      padding: 11px 16px;
      font-size: 13px;
    }

    .join:hover,
    .main-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(255,207,0,.18);
    }

    .hero {
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 24px;
      text-align: center;
    }

    .kicker,
    .eyebrow {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .kicker::before {
      content: "●";
      margin-right: 8px;
    }

    .hero h1 {
      margin: 23px 0 0;
      max-width: 850px;
      font-size: clamp(44px, 7vw, 82px);
      line-height: .99;
      letter-spacing: -5px;
    }

    .hero p {
      margin: 27px 0 30px;
      color: #bdbdbd;
      font-size: 22px;
      line-height: 1.45;
    }

    .main-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      font-size: 16px;
    }

    .hero-note {
      display: flex;
      gap: 14px;
      margin-top: 28px;
      color: #777;
      font-size: 11px;
    }

    .divider {
      width: 3px;
      height: 3px;
      margin-top: 5px;
      border-radius: 50%;
      background: #777;
    }

    .trust {
      border-block: 1px solid var(--line);
      background: #151515;
    }

    .trust-inner {
      display: flex;
      justify-content: center;
      gap: 100px;
      padding: 19px;
      color: #aaa;
      font-size: 12px;
    }

    .trust-inner span::before {
      content: "✓";
      margin-right: 8px;
      color: var(--yellow);
      font-weight: bold;
    }

    .resources {
      padding: 105px 24px;
    }

    .heading {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: end;
      margin-bottom: 42px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 25px;
      height: 2px;
      margin: 0 9px 3px 0;
      background: var(--yellow);
    }

    h2 {
      margin: 15px 0 0;
      font-size: clamp(36px, 4vw, 55px);
      line-height: 1.02;
      letter-spacing: -3px;
    }

    .heading p {
      margin: 0;
      color: #989898;
      font-size: 15px;
      line-height: 1.65;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      min-height: 276px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 24px;
      transition: .2s;
    }

    .card:first-child {
      border-color: rgba(255,207,0,.45);
      background: linear-gradient(145deg, #292613, #202020 55%);
    }

    .card:hover {
      border-color: rgba(255,207,0,.6);
      transform: translateY(-5px);
      background: #222;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      color: var(--yellow);
      background: rgba(255,207,0,.1);
      font-size: 20px;
    }

    .tag {
      color: #888;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 23px 0 10px;
      font-size: 22px;
      line-height: 1.14;
      letter-spacing: -.7px;
    }

    .card p {
      margin: 0;
      color: #bdbdbd;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail {
      margin-top: auto;
      padding: 0;
      border: 0;
      background: none;
      color: var(--yellow);
      font-size: 14px;
      font-weight: 800;
      text-align: left;
    }

    .detail:hover {
      text-decoration: underline;
    }

    .detail-page {
      min-height: calc(100vh - 78px);
    }

    .detail-hero {
      padding: 76px 24px 70px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 42px;
      color: #969696;
      font-size: 13px;
    }

    .back-link:hover {
      color: var(--yellow);
    }

    .detail-icon {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin: 0 auto 24px;
      border: 1px solid rgba(255,207,0,.35);
      border-radius: 15px;
      color: var(--yellow);
      background: rgba(255,207,0,.1);
      font-size: 24px;
    }

    .detail-hero .eyebrow {
      justify-content: center;
    }

    .detail-hero h1 {
      margin: 18px 0 0;
      font-size: clamp(40px, 6vw, 70px);
      line-height: 1;
      letter-spacing: -4px;
    }

    .detail-hero p {
      max-width: 560px;
      margin: 22px auto 0;
      color: #a7a7a7;
      font-size: 17px;
      line-height: 1.6;
    }

    .detail-content {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 22px;
      padding: 0 24px 110px;
    }

    .detail-panel,
    .detail-aside {
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      padding: 34px;
    }

    .detail-panel {
      border-color: rgba(255,207,0,.35);
      background: linear-gradient(145deg, #292613, #202020 55%);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      color: var(--yellow);
      font-size: 13px;
      font-weight: 800;
    }

    .points {
      display: grid;
      gap: 16px;
      padding: 26px 0 30px;
    }

    .point {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #d0d0d0;
      font-size: 14px;
    }

    .point::before {
      content: "✓";
      color: var(--yellow);
      font-weight: bold;
    }

    .detail-aside {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .aside-label {
      color: var(--yellow);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .detail-aside h2 {
      margin-top: 15px;
      font-size: 36px;
    }

    .detail-aside p {
      margin: 22px 0 27px;
      color: #999;
      font-size: 14px;
      line-height: 1.65;
    }

    .outline {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 17px;
      border: 1px solid rgba(255,207,0,.55);
      border-radius: 7px;
      color: var(--yellow);
      font-size: 13px;
      font-weight: 800;
    }

    .outline:hover {
      background: rgba(255,207,0,.08);
    }

    @media (max-width: 800px) {
      .container {
        padding-inline: 20px;
      }

      nav {
        gap: 15px;
      }

      .nav {
        gap: 15px;
      }

      .login {
        display: none;
      }

      .hero {
        min-height: 540px;
        padding-top: 55px;
      }

      .hero h1 {
        font-size: 44px;
        letter-spacing: -2.8px;
      }

      .hero p {
        font-size: 17px;
      }

      .trust-inner {
        gap: 24px;
        justify-content: space-between;
      }

      .trust-inner span {
        font-size: 10px;
      }

      .heading {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .resources {
        padding-block: 72px;
      }

      .detail-content {
        grid-template-columns: 1fr;
        padding-bottom: 75px;
      }

      .detail-panel,
      .detail-aside {
        padding: 26px;
      }

      .detail-hero {
        padding-top: 52px;
        padding-bottom: 54px;
      }
    }

    @media (max-width: 520px) {
      nav {
        display: none;
      }

      .nav {
        height: 68px;
      }

      .brand {
        font-size: 28px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 16px;
      }

      .hero-note {
        flex-direction: column;
        gap: 8px;
      }

      .divider {
        display: none;
      }

      .trust-inner {
        padding-block: 16px;
      }

      .trust-inner span:last-child {
        display: none;
      }

      .trust-inner span {
        font-size: 9px;
      }

      .card {
        min-height: 235px;
      }

      .detail-hero h1 {
        font-size: 42px;
        letter-spacing: -2.5px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <a class="brand" href="#top">
        Khanh<span>lo</span>
      </a>

      <nav>
        <a class="nav-link" href="#top">Trang chủ</a>
        <a class="nav-link" href="#resources">Tài nguyên</a>
      </nav>

      <button class="login" onclick="notify('Đăng nhập')">
        Đăng nhập
      </button>

      <button class="join" onclick="notify('Tham gia cộng đồng')">
        Tham gia →
      </button>
    </div>
  </header>

  <main id="app"></main>

  <script>
    const resources = {
      "script-banana": {
        title: "Script Banana Miễn Phí",
        tag: "Nổi bật",
        icon: "✦",
        summary: ".  Script Banana ",
        points: [
          "chi 1 người may mắn mỗi tuần sẽ được banana miễn phí"
        ]
      },

      "hack-vng": {
        title: "Hack Roblox VNG_Quốc Tế",
        tag: "Script",
        icon: "⌘",
        summary: "Trang thông tin riêng cho hack Roblox VNG_Quốc Tế."
        points: [
          "Thông tin hack được trình bày minh bạch",
          "hack roblox_vng và quốc tế ở đây."
        ],
        external: "https://link4sub.com/4golkVG3Ch"
      },

      "script": {
        title: "Script",
        tag: "Miễn phí",
        icon: "&lt;/&gt;",
        summary: "Kho script miễn phí "
        points: [
          "những script không cần get key."
        ]
      }
    };

    function notify(message) {
      alert(message + "\n\nTính năng đang được hoàn thiện.");
    }

    function home() {
      return `
        <section id="top" class="hero container">
          <div class="kicker">
            CỘNG ĐỒNG ROBLOX Khanhlo
          </div>

          <h1>
            Khám Phá hack <br>
            <span>Roblox </span>
          </h1>

          <p>
  
          </p>

          <button
            class="main-button"
            onclick="location.hash='resources'">
            Tham gia ngay →
          </button>

          <div class="hero-note">
            <span>Được xây dựng cho người mới</span>
            <span class="divider"></span>
            <span>Hoàn toàn miễn phí</span>
          </div>
        </section>

        <section class="trust">
          <div class="container trust-inner">
            <span>Nội dung dễ hiểu</span>
            <span>An toàn & minh bạch</span>
            <span>Cộng đồng hỗ trợ</span>
          </div>
        </section>

        <section id="resources" class="resources container">
          <div class="heading">
            <div>
              <div class="eyebrow">TÀI NGUYÊN MỚI</div>

              <h2>
                Học nhanh hơn.<br>
                <strong>Làm tốt hơn.</strong>
              </h2>
            </div>

            <p>
              Những nội dung thực tế, được chọn lọc để bạn có thể bắt đầu xây dựng thế giới Roblox của riêng mình.
            </p>
          </div>

          <div class="cards">
            ${Object.entries(resources).map(([slug, resource]) => `
              <article class="card">
                <div class="card-top">
                  <span class="icon">${resource.icon}</span>
                  <span class="tag">${resource.tag}</span>
                </div>

                <h3>${resource.title}</h3>
                <p>${resource.summary}</p>

                <a class="detail" href="#resource/${slug}">
                  Xem chi tiết →
                </a>
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function detail(slug) {
      const resource = resources[slug] || resources.script;

      const action = resource.external
        ? `
          <a
            class="main-button"
            href="${resource.external}"
            target="_blank"
            rel="noopener noreferrer">
            Mở liên kết nguồn ↗
          </a>
        `
        : `
          <button
            class="main-button"
            onclick="notify('Bắt đầu tìm hiểu')">
            Bắt đầu tìm hiểu ↗
          </button>
        `;

      return `
        <section class="detail-page">
          <div class="detail-hero container">
            <a class="back-link" href="#resources">
              ← Quay lại tài nguyên
            </a>

            <div class="detail-icon">
              ${resource.icon}
            </div>

            <div class="eyebrow">
              ${resource.tag}
            </div>

            <h1>${resource.title}</h1>
            <p>${resource.summary}</p>
          </div>

          <section class="detail-content container">
            <div class="detail-panel">
              <div class="panel-heading">
                ▣ &nbsp; Thông tin tài nguyên
              </div>

              <div class="points">
                ${resource.points.map(point => `
                  <div class="point">
                    ${point}
                  </div>
                `).join("")}
              </div>

              ${action}
            </div>

            <aside class="detail-aside">
              <span class="aside-label">Khanhlo note</span>

              <h2>
                Học đúng cách,<br>
                <strong>xây tốt hơn.</strong>
              </h2>

              <p>
                Hãy kiểm tra nguồn tải, đọc hướng dẫn và chỉ sử dụng tài nguyên trong môi trường thử nghiệm an toàn.
              </p>

              <a class="outline" href="#resources">
                Xem các tài nguyên khác ←
              </a>
            </aside>
          </section>
        </section>
      `;
    }

    function render() {
      const hash = location.hash.replace("#", "");

      document.getElementById("app").innerHTML =
        hash.startsWith("resource/")
          ? detail(hash.split("/")[1])
          : home();

      if (hash === "resources") {
        document
          .getElementById("resources")
          ?.scrollIntoView();
      }
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
