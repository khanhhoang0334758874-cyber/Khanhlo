<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Khanhlo — Roblox Scripting</title>

  <style>
    :root {
      --bg: #111;
      --card: #1d1d1d;
      --green: #39ff14;
      --text: #f7f7f7;
      --muted: #aaa;
      --line: rgba(255,255,255,.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(17,17,17,.95);
      backdrop-filter: blur(14px);
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .brand span:last-child,
    h1 span,
    h2 strong,
    .card h3 {
      color: var(--green);
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--green);
      border-radius: 9px;
      color: #071007;
      background: linear-gradient(145deg, #39ff14, #0b8f16);
      box-shadow: 0 0 10px var(--green);
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 30px;
      margin-left: auto;
    }

    .nav-link,
    .login {
      border: 0;
      background: none;
      color: #c5c5c5;
      font-size: 14px;
    }

    .join,
    .main-button {
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #111;
      font-weight: 800;
    }

    .join {
      padding: 11px 16px;
      font-size: 13px;
    }

    .hero {
      min-height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 28px;
      padding-bottom: 28px;
      text-align: center;
    }

    .kicker,
    .eyebrow {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    @keyframes dotCycle {
      0%, 100% {
        color: #39ff14;
        text-shadow: 0 0 8px #39ff14;
      }

      25% {
        color: #2693ff;
        text-shadow: 0 0 8px #2693ff;
      }

      50% {
        color: #ff3b4d;
        text-shadow: 0 0 8px #ff3b4d;
      }

      75% {
        color: #ffe04b;
        text-shadow: 0 0 8px #ffe04b;
      }
    }

    .kicker::before {
      content: "●";
      display: inline-block;
      margin-right: 8px;
      animation: dotCycle 8s ease-in-out infinite;
    }

    .hero h1 {
      margin: 14px 0 0;
      font-size: clamp(40px, 7vw, 68px);
      line-height: 1;
      letter-spacing: -3px;
    }

    .resources {
      padding-top: 28px;
      padding-bottom: 55px;
    }

    .heading {
      margin-bottom: 24px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 25px;
      height: 2px;
      margin: 0 9px 3px 0;
      background: var(--green);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      min-height: 235px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      transition: .2s;
    }

    .card:first-child {
      border-color: rgba(57,255,20,.45);
      background: linear-gradient(145deg, #142414, #171c17 55%);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--green);
      box-shadow: 0 0 25px rgba(57,255,20,.22);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      color: var(--green);
      background: rgba(57,255,20,.1);
      font-size: 20px;
    }

    .tag {
      color: #888;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 23px 0 10px;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #bdbdbd;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail {
      margin-top: auto;
      padding-top: 20px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }

    /* Thống kê */

    .stats-section {
      padding: 16px 24px 48px;
    }

    .stats-board {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 30px;
      overflow: hidden;
      padding: 26px;
      border: 1px solid rgba(57,255,20,.25);
      border-radius: 18px;
      background: linear-gradient(135deg, #142414, #111711 48%, #101310);
      box-shadow: inset 0 0 40px rgba(57,255,20,.045);
    }

    .stats-title {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .stats-subtitle {
      margin: 0;
      color: #94a394;
      font-size: 12px;
      line-height: 1.5;
    }

    .stats-numbers {
      display: grid;
      gap: 10px;
      margin-top: 25px;
    }

    .stat-number {
      padding: 16px;
      border: 1px solid rgba(57,255,20,.25);
      border-radius: 12px;
      background: rgba(0,0,0,.25);
    }

    .stat-number strong {
      display: block;
      color: #f0ffed;
      font-size: 28px;
    }

    .stat-number span {
      display: block;
      margin-top: 8px;
      color: #8d9c8d;
      font-size: 11px;
    }

    .chart-heading {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: #d7e4d4;
      font-size: 13px;
      font-weight: 800;
    }

    .chart-heading span:last-child {
      color: #809080;
      font-size: 11px;
      font-weight: 400;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      min-height: 190px;
      overflow-x: auto;
      padding: 20px 10px 0;
      border-bottom: 1px solid rgba(57,255,20,.28);
    }

    .bar-wrap {
      display: flex;
      height: 165px;
      min-width: 48px;
      flex: 0 0 48px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .bar-value {
      color: #b8ffad;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bar {
      width: 24px;
      min-height: 8px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(to top, #1a9b15, #39ff14);
      box-shadow: 0 0 11px rgba(57,255,20,.24);
    }

    .bar-label {
      color: #829082;
      font-size: 10px;
      white-space: nowrap;
    }

    .total-bar {
      min-width: 66px;
      flex-basis: 66px;
      margin-left: 5px;
      padding-left: 12px;
      border-left: 1px solid rgba(57,255,20,.25);
    }

    .total-bar .bar {
      background: linear-gradient(to top, #39ff14, #c7ff3d);
    }

    .stats-note {
      margin: 12px 0 0;
      color: #738073;
      font-size: 10px;
      text-align: right;
    }

    /* Trang chi tiết */

    .detail-page {
      min-height: calc(100vh - 78px);
    }

    .detail-hero {
      padding: 52px 24px 54px;
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 42px;
      color: #969696;
      font-size: 13px;
    }

    .detail-icon {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin: auto auto 24px;
      border: 1px solid rgba(57,255,20,.35);
      border-radius: 15px;
      color: var(--green);
      background: rgba(57,255,20,.1);
      font-size: 24px;
    }

    .detail-hero h1 {
      margin: 18px 0 0;
      font-size: clamp(40px, 6vw, 70px);
      line-height: 1;
    }

    .detail-hero p {
      max-width: 560px;
      margin: 22px auto 0;
      color: #a7a7a7;
      line-height: 1.6;
    }

    .detail-content {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 22px;
      padding: 0 24px 75px;
    }

    .detail-panel,
    .detail-aside {
      padding: 26px;
      border: 1px solid rgba(57,255,20,.4);
      border-radius: 13px;
      background: linear-gradient(145deg, #142414, #171c17 55%);
    }

    .detail-aside h2 {
      color: var(--green);
    }

    .detail-aside p {
      color: #d0d0d0;
      line-height: 1.65;
    }

    .outline {
      display: inline-flex;
      padding: 12px 17px;
      border: 1px solid rgba(57,255,20,.55);
      border-radius: 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    .banana-code-title {
      margin: 0 0 16px;
      color: var(--green);
      font-size: 22px;
      font-weight: 800;
      word-spacing: 8px;
    }

    .banana-code,
    .hub-code {
      overflow: auto;
      padding: 15px;
      border: 1px solid rgba(57,255,20,.3);
      border-radius: 9px;
      background: #080d08;
      color: #b8ffad;
      font: 12px/1.7 Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .banana-copy,
    .hub-copy {
      margin-top: 12px;
      padding: 9px 13px;
      border: 1px solid rgba(57,255,20,.5);
      border-radius: 7px;
      color: var(--green);
      background: transparent;
      font-weight: 800;
    }

    .hub-list {
      display: grid;
      gap: 14px;
    }

    .hub-card {
      padding: 18px;
      border: 1px solid rgba(57,255,20,.25);
      border-radius: 12px;
      background: rgba(5,16,5,.42);
    }

    .hub-card h3 {
      margin: 0 0 8px;
      color: var(--green);
    }

    .hub-card p {
      color: #c3cec2;
      font-size: 13px;
      line-height: 1.55;
    }

    .hack-links {
      display: grid;
      gap: 10px;
    }

    .main-button {
      display: flex;
      justify-content: center;
      padding: 15px;
      text-align: center;
    }

    @media (max-width: 800px) {
      nav {
        gap: 15px;
      }

      .login {
        display: none;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .stats-board,
      .detail-content {
        grid-template-columns: 1fr;
      }

      .stats-numbers {
        grid-template-columns: 1fr 1fr;
      }

      .detail-panel,
      .detail-aside {
        padding: 20px;
      }
    }

    @media (max-width: 520px) {
      nav {
        display: none;
      }

      .nav {
        min-height: 68px;
      }

      .brand {
        font-size: 28px;
      }

      .hero {
        min-height: 270px;
        padding-top: 22px;
        padding-bottom: 22px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .stats-section {
        padding-left: 20px;
        padding-right: 20px;
      }

      .stats-board {
        padding: 20px;
      }

      .stats-numbers {
        grid-template-columns: 1fr 1fr;
      }

      .detail-content {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <a class="brand" href="#top">
        <span class="brand-mark">M</span>
        Khanh<span>lo</span>
      </a>

      <nav>
        <a class="nav-link" href="#top">Trang chủ</a>
        <a class="nav-link" href="#resources">Tài nguyên</a>
      </nav>

      <button class="login" onclick="notify('Đăng nhập')">
        Đăng nhập
      </button>

      <button class="join" onclick="notify('Tham gia cộng đồng')">
        Tham gia →
      </button>
    </div>
  </header>

  <main id="app"></main>

  <script>
    const resources = {
      "script-banana": {
        title: "Script Banana Miễn Phí",
        tag: "Nổi bật",
        icon: "✦",
        summary:
          "Mỗi 1 tuần sẽ có 1 bạn may mắn nhận được script banana (lưu ý banana chỉ dùng được 8 ngày)👇",
        points: [
          "Hướng dẫn cài đặt rõ ràng cho người mới",
          "Cập nhật thông tin theo từng phiên bản",
          "Khu vực hỏi đáp và chia sẻ kinh nghiệm"
        ]
      },

      "hack-vng": {
        title: "Hack Roblox VNG_Quốc Tế",
        tag: "Script",
        icon: "⌘",
        summary: "Mọi hack roblox miễn phí đều ở đây👇",
        external: "https://link4sub.com/Pxo1a6ePS0",
        external2:
          "https://www.mediafire.com/file/i1918071p04vq7z/Delta+Vng+V2.738.apk/file?dkey=47espvd3o7e&r=1433",
        external3: "https://link4sub.com/EIHVlu5ddD",
        external4: "https://link4sub.com/cm0Bx8ZNdn"
      },

      script: {
        title: "Script",
        tag: "Miễn phí",
        icon: "&lt;/&gt;",
        summary: "Các script miễn phí không cần get key👇"
      }
    };

    const scriptHubs = [
      {
        name: "Redz Hub",
        description:
          "Hỗ trợ Auto Farm, V4 Draco và được tối ưu để giảm lag trong quá trình sử dụng:",
        code: `local Settings = {JoinTeam = "Pirates"; Translator = true;}
loadstring(game:HttpGet("https://raw.githubusercontent.com/newredz/BloxFruits/refs/heads/main/Source.luau"))()`
      },

      {
        name: "Hoho Hub",
        description:
          "Tích hợp chế độ Auto Farm, Sea Event, Auto Fly và tối ưu hiệu suất để giảm lag đáng kể, bạn chỉ cần chạy lệnh:",
        code:
          'loadstring(game:HttpGet("https://raw.githubusercontent.com/acsu123/HOHO_H/main/Loading_UI"))()'
      },

      {
        name: "Blue X Hub",
        description:
          "Hỗ trợ Auto Farm, Sea Event, Magnet và được tối ưu để chạy ổn định, không gây giật lag:",
        code:
          'loadstring(game:HttpGet("https://raw.githubusercontent.com/Dev-BlueX/BlueX-Hub/refs/heads/main/Main.lua"))()'
      },

      {
        name: "Vxeze Hub",
        description:
          "Được thiết kế cho Auto Farm, Gun Mastery, Raid và Volcano Event, có khả năng giảm lag trong quá trình chạy script:",
        code:
          'loadstring(game:HttpGet("https://raw.githubusercontent.com/Dex-Bear/Vxezehub/refs/heads/main/Skidlamcho.txt"))()'
      },

      {
        name: "Quartz Kaitun Hub",
        description:
          "Tích hợp chế độ Auto Kaitun, Farm và có cấu hình tối ưu để hạn chế giật lag:",
        code: `getgenv().Mode = "OneClick"
loadstring(game:HttpGet("https://raw.githubusercontent.com/xQuartyx/QuartyzScript/main/Loader.lua"))()`
      },

      {
        name: "Maru Hub",
        description:
          "Hỗ trợ Auto Farm, Raid, Rain Fruit và hoạt động ổn định không cần khóa:",
        code: `getgenv().Team = "Marines"
loadstring(game:HttpGet("https://raw.githubusercontent.com/LuaCrack/KimP/refs/heads/main/MaruHub"))()`
      }
    ];

    function notify(message) {
      alert(message + "\n\nTính năng đang được hoàn thiện.");
    }

    function home() {
      const months = [
        ["1.020", "56%", "Tháng 1"],
        ["1.180", "64%", "Tháng 2"],
        ["1.260", "68%", "Tháng 3"],
        ["1.340", "72%", "Tháng 4"],
        ["1.410", "76%", "Tháng 5"],
        ["1.520", "82%", "Tháng 6"],
        ["1.460", "79%", "Tháng 7"],
        ["1.570", "85%", "Tháng 8"],
        ["1.630", "88%", "Tháng 9"],
        ["1.680", "91%", "Tháng 10"],
        ["1.720", "94%", "Tháng 11"],
        ["1.630", "88%", "Tháng 12"],
        ["17.420", "100%", "Tổng cộng"]
      ];

      const chart = months.map((item, index) => `
        <div class="bar-wrap ${index === 12 ? "total-bar" : ""}">
          <span class="bar-value">${item[0]}</span>
          <span class="bar" style="height:${item[1]}"></span>
          <span class="bar-label">${item[2]}</span>
        </div>
      `).join("");

      return `
        <section id="top" class="hero container">
          <div class="kicker">KHANHLO</div>
          <h1>Hack và<br><span>Script</span></h1>
        </section>

        <section id="resources" class="resources container">
          <div class="heading">
            <div class="eyebrow">MỌI THỨ Ở ĐÂY 👇</div>
          </div>

          <div class="cards">
            ${Object.entries(resources).map(([slug, resource]) => `
              <article class="card">
                <div class="card-top">
                  <span class="icon">${resource.icon}</span>
                  <span class="tag">${resource.tag}</span>
                </div>

                <h3>${resource.title}</h3>
                <p>${resource.summary}</p>

                <a class="detail" href="#resource/${slug}">
                  Xem chi tiết →
                </a>
              </article>
            `).join("")}
          </div>
        </section>

        <section class="stats-section container">
          <div class="stats-board">
            <div>
              <p class="stats-title">Thống kê truy cập</p>
              <p class="stats-subtitle">
                Theo dõi lượt xem website trong tháng
              </p>

              <div class="stats-numbers">
                <div class="stat-number">
                  <strong>1.630</strong>
                  <span>Tháng gần nhất</span>

                <div class="stat-number">

              </div>

            <div>

                <span>Lượt truy cập theo tháng</span>
                <span>Đơn vị: lượt xem</span>

              <div class="chart">
                ${chart}
              </div>

              <p class="stats-note">
                Dữ liệu mẫu · Tổng được cộng từ 12 tháng
              </p>
            </div>
          </div>
        </section>
      `;
    }

    function detail(slug) {
      const resource = resources[slug] || resources.script;

      const bananaCode = `repeat wait() until game:IsLoaded() and game.Players.LocalPlayer
getgenv().Key = "4e5e1052ab89e718d907a117"
loadstring(game:HttpGet("https://raw.githubusercontent.com/obiiyeuem/vthangsitink/main/BananaHub.lua"))()`;

      let content = "";

      if (resource.title === "Script Banana Miễn Phí") {
        content = `
          <div class="banana-code-wrap">
            <h2 class="banana-code-title">Script Banana</h2>
            <pre class="banana-code" id="banana-code">${bananaCode}</pre>
            <button class="banana-copy" onclick="copyBananaCode()">
              Sao chép code
            </button>
          </div>
        `;
      } else if (resource.title === "Script") {
        content = `
          <div class="panel-heading">▣ &nbsp; Các script hub miễn phí</div>

          <div class="hub-list">
            ${scriptHubs.map((hub, index) => `
              <article class="hub-card">
                <h3>${hub.name}</h3>
                <p>${hub.description}</p>
                <pre class="hub-code" id="hub-code-${index}">${hub.code}</pre>
                <button class="hub-copy" onclick="copyHubCode(${index})">
                  Sao chép code
                </button>
              </article>
            `).join("")}
          </div>
        `;
      }

      let links = "";

      if (resource.title === "Hack Roblox VNG_Quốc Tế") {
        links = `
          <div class="hack-links">
            <a class="main-button" target="_blank" rel="noopener"
              href="${resource.external}">
              Delta vng login ↗
            </a>

            <a class="main-button" target="_blank" rel="noopener"
              href="${reso
