  <style>
    :root{--bg:#111;--surface:#1d1d1d;--line:rgba(255,255,255,.13);--yellow:#39ff14;--muted:#b6b6b6}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
    .container{width:100%;max-width:1180px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(17,17,17,.95);backdrop-filter:blur(14px)}
    .nav{height:78px;display:flex;align-items:center;gap:30px}.brand{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:#fff;font-size:30px;font-weight:800;letter-spacing:-2px}.brand-mark{position:relative;display:grid;width:28px;height:28px;place-items:center;overflow:hidden;border:1px solid rgba(57,255,20,.85);border-radius:9px;color:#0b180b;background:linear-gradient(145deg,#39ff14,#0b8f16);box-shadow:0 0 9px rgba(57,255,20,.95),0 0 24px rgba(57,255,20,.45),inset 0 0 9px rgba(255,255,255,.25);font-family:Arial Black,Arial,sans-serif;font-size:16px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 1px 0 rgba(255,255,255,.35);transform:skew(-5deg)}.brand-mark:after{content:'';position:absolute;right:-8px;bottom:-8px;width:19px;height:19px;border:1px solid rgba(255,255,255,.38);border-radius:50%;opacity:.55}.brand>span:last-child,h1 span,h2 strong,.card h3{color:var(--yellow)}nav{display:flex;gap:32px;margin-left:auto}.nav-link,.login{border:0;background:none;color:#c5c5c5;font-size:14px}.nav-link:hover,.login:hover{color:#fff}.join,.main-button{border:0;border-radius:8px;background:var(--yellow);color:#111;font-weight:800;transition:.2s}.join{padding:11px 16px;font-size:13px}.join:hover,.main-button:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(57,255,20,.18)}
    @keyframes softDotCycle{0%,100%{color:#39ff14;text-shadow:0 0 8px rgba(57,255,20,.75)}25%{color:#2693ff;text-shadow:0 0 8px rgba(38,147,255,.7)}50%{color:#ff3b4d;text-shadow:0 0 8px rgba(255,59,77,.65)}75%{color:#ffe04b;text-shadow:0 0 8px rgba(255,224,75,.65)}}.hero{min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px;text-align:center}.kicker,.eyebrow{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:1.8px}.kicker:before{content:'●';display:inline-block;margin-right:8px;animation:softDotCycle 8s ease-in-out infinite}.hero h1{margin:23px 0 0;max-width:850px;font-size:clamp(44px,7vw,82px);line-height:.99;letter-spacing:-5px}.hero p{margin:27px 0 30px;color:#bdbdbd;font-size:22px;line-height:1.45}.main-button{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;font-size:16px}.hero-note{display:flex;gap:14px;margin-top:28px;color:#777;font-size:11px}.divider{width:3px;height:3px;margin-top:5px;border-radius:50%;background:#777}.trust{border-block:1px solid var(--line);background:#151515}.trust-inner{display:flex;justify-content:center;gap:100px;padding:19px;color:#aaa;font-size:12px}.trust-inner span:before{content:'✓';margin-right:8px;color:var(--yellow);font-weight:bold}
    .resources{padding:105px 24px}.heading{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:42px}.eyebrow:before{content:'';display:inline-block;width:25px;height:2px;margin:0 9px 3px 0;background:var(--yellow)}.script-logo{display:inline-grid;width:31px;height:31px;place-items:center;margin-right:9px;border:1px solid rgba(57,255,20,.8);border-radius:9px;color:var(--yellow);background:rgba(57,255,20,.1);box-shadow:0 0 15px rgba(57,255,20,.4);font-family:Arial Black,Arial,sans-serif;font-size:15px;letter-spacing:-2px;vertical-align:middle}h2{margin:15px 0 0;font-size:clamp(36px,4vw,55px);line-height:1.02;letter-spacing:-3px}.heading p{margin:0;color:#989898;font-size:15px;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{min-height:276px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:24px;transition:.2s}.card:first-child{border-color:rgba(57,255,20,.45);background:linear-gradient(145deg,#142414,#171c17 55%)}.card:hover{border-color:rgba(57,255,20,.9);transform:translateY(-5px);background:#1c261c;box-shadow:0 0 0 1px rgba(57,255,20,.2),0 0 26px rgba(57,255,20,.22),inset 0 0 24px rgba(57,255,20,.06)}.card-top{display:flex;justify-content:space-between;align-items:center}.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;color:var(--yellow);background:rgba(57,255,20,.1);font-size:20px}.tag{color:#888;font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}.card h3{margin:23px 0 10px;font-size:22px;line-height:1.14;letter-spacing:-.7px}.card p{margin:0;color:#bdbdbd;font-size:14px;line-height:1.55}.detail{margin-top:auto;padding:0;border:0;background:none;color:var(--yellow);font-size:14px;font-weight:800;text-align:left}.detail:hover{text-decoration:underline}
    .banana-code-title{margin:0 0 16px;color:var(--yellow);font-size:22px;font-weight:800;word-spacing:8px;letter-spacing:.02em}.banana-code{margin:0;overflow:auto;padding:20px;border:1px solid rgba(57,255,20,.35);border-radius:10px;background:#0b120b;color:#b8ffad;font:13px/1.7 Consolas,Monaco,monospace;white-space:pre-wrap;word-break:break-word}.banana-code-wrap{padding-top:4px}.banana-copy{margin-top:16px;padding:11px 15px;border:1px solid rgba(57,255,20,.55);border-radius:7px;color:var(--yellow);background:transparent;font-weight:800}.banana-copy:hover{background:rgba(57,255,20,.08)}
    .detail-page{min-height:calc(100vh - 78px)}.detail-hero{padding:76px 24px 70px;text-align:center}.back-link{display:inline-flex;align-items:center;gap:7px;margin-bottom:42px;color:#969696;font-size:13px}.back-link:hover{color:var(--yellow)}.detail-icon{display:grid;width:58px;height:58px;place-items:center;margin:0 auto 24px;border:1px solid rgba(57,255,20,.35);border-radius:15px;color:var(--yellow);background:rgba(57,255,20,.1);font-size:24px}.detail-hero .eyebrow{justify-content:center}.detail-hero h1{margin:18px 0 0;font-size:clamp(40px,6vw,70px);line-height:1;letter-spacing:-4px}.detail-hero p{max-width:560px;margin:22px auto 0;color:#a7a7a7;font-size:17px;line-height:1.6}.detail-content{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;padding:0 24px 110px}.detail-panel,.detail-aside{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:34px}.detail-panel{border-color:rgba(57,255,20,.35);background:linear-gradient(145deg,#142414,#171c17 55%)}.panel-heading{display:flex;align-items:center;gap:9px;padding-bottom:20px;border-bottom:1px solid var(--line);color:var(--yellow);font-size:13px;font-weight:800}.points{display:grid;gap:16px;padding:26px 0 30px}.point{display:flex;align-items:center;gap:11px;color:#d0d0d0;font-size:14px}.point:before{content:'✓';color:var(--yellow);font-weight:bold}.detail-slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 25px}.slot{min-height:105px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;border:1px dashed rgba(57,255,20,.45);border-radius:10px;color:#8c8c8c;background:rgba(57,255,20,.035);font-size:12px;text-align:center}.slot strong{color:var(--yellow);font-size:13px}.detail-aside{display:flex;flex-direction:column;justify-content:center}.aside-label{color:var(--yellow);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.detail-aside h2{margin-top:15px;font-size:36px}.detail-aside p{margin:22px 0 27px;color:#999;font-size:14px;line-height:1.65}.outline{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border:1px solid rgba(57,255,20,.55);border-radius:7px;color:var(--yellow);font-size:13px;font-weight:800}.outline:hover{background:rgba(57,255,20,.08)}
    @media(max-width:800px){.container{padding-inline:20px}nav{gap:15px}.nav{gap:15px}.login{display:none}.hero{min-height:540px;padding-top:55px}.hero h1{font-size:44px;letter-spacing:-2.8px}.hero p{font-size:17px}.trust-inner{gap:24px;justify-content:space-between}.trust-inner span{font-size:10px}.heading{grid-template-columns:1fr;gap:25px}.cards{grid-template-columns:1fr}.resources{padding-block:72px}.detail-content{grid-template-columns:1fr;padding-bottom:75px}.detail-panel,.detail-aside{padding:26px}.detail-hero{padding-top:52px;padding-bottom:54px}}
    @media(max-width:520px){nav{display:none}.nav{height:68px}.brand{font-size:28px}.hero h1{font-size:42px}.hero p{font-size:16px}.hero-note{flex-direction:column;gap:8px}.divider{display:none}.trust-inner{padding-block:16px}.trust-inner span:last-child{display:none}.trust-inner span{font-size:9px}.card{min-height:235px}.detail-hero h1{font-size:42px;letter-spacing:-2.5px}}

<body>
  <header>
    <div class="container nav">
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true">M</span> Khanh<span>lo</span></a>
      <nav><a class="nav-link" href="#top">Trang chủ</a><a class="nav-link" href="#resources">Tài nguyên</a></nav>
      <button class="login" onclick="notify('Đăng nhập')">Đăng nhập</button>
      <button class="join" onclick="notify('Tham gia cộng đồng')">Tham gia →</button>
    </div>

  <main id="app"></main>
  <script>
    const resources={
      'script-banana':{title:'Script Banana Miễn Phí',tag:'Nổi bật',icon:'✦',summary:'Mỗi 1 tuần sẽ có 1 bạn may mắn nhận được script banana (lưu ý banana chỉ dùng được 8 ngày)👇',points:['Hướng dẫn cài đặt rõ ràng cho người mới','Cập nhật thông tin theo từng phiên bản','Khu vực hỏi đáp và chia sẻ kinh nghiệm']},
      'hack-vng':{title:'Hack Roblox VNG_Quốc Tế',tag:'Script',icon:'⌘',summary:'Mọi hack roblox miễn phí đều ở đây👇',points:['Thông tin tài nguyên được trình bày minh bạch','Mở liên kết nguồn ở tab mới','Không chứa mã độc hoặc mã exploit trực tiếp trên website'],external:'https://link4sub.com/Pxo1a6ePS0',external2:'https://www.mediafire.com/file/i1918071p04vq7z/Delta+Vng+V2.738.apk/file?dkey=47espvd3o7e&r=1433',external3:'https://link4sub.com/EIHVlu5ddD',external4:'https://link4sub.com/cm0Bx8ZNdn'},
      script:{title:'Script',tag:'Miễn phí',icon:'&lt;/&gt;',summary:'Các script miễn phí không cần get key👇',points:['Ví dụ Lua dễ đọc và dễ chỉnh sửa','Tập trung vào mục đích học tập','Có thể mở rộng thành hệ thống gameplay riêng']}
    };
    function notify(message){alert(message+'\n\nTính năng đang được hoàn thiện.');}
    function home(){return `<section id="top" class="hero container"><div class="kicker">KHANHLO</div><h1>Hack và<br><span>Script</span></h1></section><section id="resources" class="resources container"><div class="heading"><div><div class="eyebrow">MỌI THỨ Ở ĐÂY 👇</div></div></div><div class="cards">${Object.entries(resources).map(([slug,r],i)=>`<article class="card"><div class="card-top"><span class="icon">${r.icon}</span><span class="tag">${r.tag}</span></div><h3>${r.title}</h3><p>${r.summary}</p><a class="detail" href="#resource/${slug}">Xem chi tiết →</a></article>`).join('')}</div></section>`}
    const scriptHubs=[
      {name:'Redz Hub',description:'Hỗ trợ Auto Farm, V4 Draco và được tối ưu để giảm lag trong quá trình sử dụng:',code:'local Settings = {JoinTeam = "Pirates"; Translator = true;}\nloadstring(game:HttpGet("https://raw.githubusercontent.com/newredz/BloxFruits/refs/heads/main/Source.luau"))()'},
      {name:'Hoho Hub',description:'Tích hợp chế độ Auto Farm, Sea Event, Auto Fly và tối ưu hiệu suất để giảm lag đáng kể, bạn chỉ cần chạy lệnh:',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/acsu123/HOHO_H/main/Loading_UI"))()'},
      {name:'Blue X Hub',description:'Hỗ trợ Auto Farm, Sea Event, Magnet và được tối ưu để chạy ổn định, không gây giật lag:',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/Dev-BlueX/BlueX-Hub/refs/heads/main/Main.lua"))()'},
      {name:'Vxeze Hub',description:'Được thiết kế cho Auto Farm, Gun Mastery, Raid và Volcano Event, có khả năng giảm lag trong quá trình chạy script:',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/Dex-Bear/Vxezehub/refs/heads/main/Skidlamcho.txt"))()'},
      {name:'Quartz Kaitun Hub',description:'Tích hợp chế độ Auto Kaitun, Farm và có cấu hình tối ưu để hạn chế giật lag:',code:'getgenv().Mode = "OneClick"\nloadstring(game:HttpGet("https://raw.githubusercontent.com/xQuartyx/QuartyzScript/main/Loader.lua"))()'},
      {name:'Maru Hub',description:'Hỗ trợ Auto Farm, Raid, Rain Fruit và hoạt động ổn định không cần khóa:',code:'getgenv().Team = "Marines"\nloadstring(game:HttpGet("https://raw.githubusercontent.com/LuaCrack/KimP/refs/heads/main/MaruHub"))()'}
    ];
    function detail(slug){const r=resources[slug]||resources.script;const bananaCode=`repeat wait() until game:IsLoaded() and game.Players.LocalPlayer
getgenv().Key = "4e5e1052ab89e718d907a117"
loadstring(game:HttpGet("https://raw.githubusercontent.com/obiiyeuem/vthangsitink/main/BananaHub.lua"))()`;const action=r.external4?`<div class="hack-links"><a class="main-button" href="${r.external}" target="_blank" rel="noopener noreferrer">Delta vng login ↗</a><a class="main-button" href="${r.external2}" target="_blank" rel="noopener noreferrer">Delta vng ↗</a><a class="main-button" href="${r.external3}" target="_blank" rel="noopener noreferrer">Delta Roblox VNG 32+64bit không cài đè ↗</a><a class="main-button" href="${r.external4}" target="_blank" rel="noopener noreferrer">Delta Roblox Quốc Tế ↗</a></div>`:r.external3?`<div class="hack-links"><a class="main-button" href="${r.external}" target="_blank" rel="noopener noreferrer">Delta vng login ↗</a><a class="main-button" href="${r.external2}" target="_blank" rel="noopener noreferrer">Delta vng ↗</a><a class="main-button" href="${r.external3}" target="_blank" rel="noopener noreferrer">Roblox VNG không cài đè 32+64bit ↗</a></div>`:r.external2?`<div class="hack-links"><a class="main-button" href="${r.external}" target="_blank" rel="noopener noreferrer">Delta vng login ↗</a><a class="main-button" href="${r.external2}" target="_blank" rel="noopener noreferrer">Delta vng ↗</a></div>`:r.external?`<a class="main-button" href="${r.external}" target="_blank" rel="noopener noreferrer">Delta vng login ↗</a>`:`<button class="main-button" onclick="notify('Bắt đầu tìm hiểu')">Bắt đầu tìm hiểu ↗</button>`;const panel=r.title==='Script Banana Miễn Phí'?`<div class="banana-code-wrap"><h2 class="banana-code-title">Script Banana</h2><pre class="banana-code" id="banana-code">${bananaCode}</pre><button class="banana-copy" onclick="copyBananaCode()">Sao chép code</button></div>`:r.title==='Hack Roblox VNG_Quốc Tế'?'':r.title==='Script'?`<div class="panel-heading">▣ &nbsp; Các script hub miễn phí</div><div class="hub-list">${scriptHubs.map((hub,index)=>`<article class="hub-card"><h3>${hub.name}</h3><p>${hub.description}</p><pre class="hub-code" id="hub-code-${index}">${hub.code}</pre><button class="hub-copy" onclick="copyHubCode(${index})">Sao chép code</button></article>`).join('')}</div>`:`<div class="panel-heading">▣ &nbsp; Thông tin tài nguyên</div><div class="points">${r.points.map(point=>`<div class="point">${point}</div>`).join('')}<div class="detail-slots"><div class="slot"><strong>▧ Hình ảnh</strong><span>Chờ bạn thêm ảnh</span></div><div class="slot"><strong>↗ Đường link</strong><span>Chờ bạn thêm link</span></div></div>`;return `<section class="detail-page"><div class="detail-hero container"><a class="back-link" href="#top">← Quay lại trang chủ</a><div class="detail-icon">${r.icon}</div><div class="eyebrow">${r.tag}</div><h1>${r.title}</h1><p>${r.summary}</p></div><section class="detail-content container"><div class="detail-panel">${panel}${r.title==='Script Banana Miễn Phí'||r.title==='Script'?'':action}</div><aside class="detail-aside"><h2>Khanhlo</h2><p>Khánh xin chân thành cảm ơn các bạn đã dành thời gian để coi video ủng hộ mình.</p><a class="outline" href="#top">Quay lại trang chủ ←</a></aside></section></section>`}
    function copyBananaCode(){const code=document.getElementById('banana-code')?.textContent||'';navigator.clipboard?.writeText(code).then(()=>notify('Đã sao chép code Script Banana')).catch(()=>notify('Hãy bôi đen và sao chép code thủ công'))}
    function copyHubCode(index){const code=document.getElementById(`hub-code-${index}`)?.textContent||'';navigator.clipboard?.writeText(code).then(()=>notify('Đã sao chép code hub')).catch(()=>notify('Hãy bôi đen và sao chép code thủ công'))}
    function render(){const hash=location.hash.replace('#','');document.getElementById('app').innerHTML=hash.startsWith('resource/')?detail(hash.split('/')[1]):home();if(hash==='resources')document.getElementById('resources')?.scrollIntoView();}
    window.addEventListener('hashchange',render);render();
  </script>
<style>
    .stats-section{padding:16px 24px 48px}.stats-board{position:relative;display:grid;grid-template-columns:280px minmax(0,1fr);gap:30px;overflow:hidden;padding:26px;border:1px solid rgba(57,255,20,.25);border-radius:18px;background:linear-gradient(135deg,#142414 0%,#111711 48%,#101310 100%);box-shadow:inset 0 0 40px rgba(57,255,20,.045),0 14px 35px rgba(0,0,0,.2)}.stats-board:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(57,255,20,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,.035) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,#000,transparent 75%)}.stats-board>*{position:relative;z-index:1}.stats-title{margin:0 0 7px;color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.stats-subtitle{margin:0;max-width:210px;color:#94a394;font-size:12px;line-height:1.5}.stats-numbers{display:grid;gap:10px;margin-top:25px}.stat-number{padding:16px;border:1px solid rgba(57,255,20,.2);border-radius:12px;background:rgba(3,12,3,.42)}.stat-number:first-child{border-color:rgba(57,255,20,.42)}.stat-number strong{display:block;color:#f0ffed;font-size:28px;line-height:1;letter-spacing:-.04em}.stat-number span{display:block;margin-top:8px;color:#8d9c8d;font-size:11px}.chart-shell{min-width:0}.chart-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;color:#d7e4d4;font-size:13px;font-weight:800}.chart-heading span{color:#809080;font-size:11px;font-weight:400}.chart{display:flex;align-items:flex-end;justify-content:flex-start;gap:12px;min-height:190px;overflow-x:auto;padding:20px 10px 0;border-bottom:1px solid rgba(57,255,20,.28);scrollbar-color:rgba(57,255,20,.5) transparent;scrollbar-width:thin}.bar-wrap{display:flex;height:165px;min-width:48px;flex:0 0 48px;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}.bar-value{color:#b8ffad;font-size:10px;font-weight:800;white-space:nowrap}.bar{width:100%;max-width:24px;min-height:8px;border-radius:7px 7px 3px 3px;background:linear-gradient(to top,#1a9b15,#39ff14);box-shadow:0 0 11px rgba(57,255,20,.24)}.bar-label{color:#829082;font-size:10px;white-space:nowrap}.total-bar{min-width:66px;flex-basis:66px;margin-left:5px;padding-left:12px;border-left:1px solid rgba(57,255,20,.25)}.total-bar-fill{max-width:30px;background:linear-gradient(to top,#39ff14,#c7ff3d);box-shadow:0 0 18px rgba(57,255,20,.52)}.stats-note{margin:12px 0 0;color:#738073;font-size:10px;text-align:right}.stats-note:before{content:'●';margin-right:6px;color:var(--yellow);font-size:8px}@media(max-width:800px){.stats-section{padding:0 20px 34px}.stats-board{grid-template-columns:1fr;gap:22px;padding:20px}.stats-subtitle{max-width:270px}.stats-numbers{grid-template-columns:1fr 1fr;margin-top:18px}.stat-number strong{font-size:24px}.chart-heading{margin-top:3px}.chart{min-height:178px}.bar-wrap{height:153px;min-width:48px;flex-basis:48px}.total-bar{min-width:64px;flex-basis:64px}}
